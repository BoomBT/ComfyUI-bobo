# ── fork 自动跟随上游 ───────────────────────────────────────────────────────
# 目标:BoomBT/ComfyUI-bobo 每 12 小时自动追平 Comfy-Org/ComfyUI,无人值守。
# 2026-09-07 comfyui-manager 建。
#
# 🔴 为什么不用 `git merge + git push`(第一版就是那么写的,真跑当场炸了,别再改回去):
#     GITHUB_TOKEN 属于 GitHub App 身份,GitHub **硬性拒绝** App 推送任何带
#     `.github/workflows/` 变更的提交,报:
#       "refusing to allow a GitHub App to create or update workflow ... without `workflows` permission"
#     而 workflow 里的 `permissions:` 块**根本没有 `workflows` 这一项**可声明 —— 无解。
#     上游 ComfyUI 隔三差五就改自己的 CI 文件,所以那条路必然在某次同步时静静炸掉。
#
# ✅ 改用 GitHub 官方的 fork 同步端点 POST /repos/{owner}/{repo}/merge-upstream:
#     由 GitHub 服务端直接做合并,不经过 git push,因此不受上面那条 App 限制;
#     顺带还省掉 checkout 整个 97MB 仓库,一次同步 2 秒完事。
#
# 为什么 cron 不用整点:GitHub 的 schedule 在整点排队最重、延迟能到几十分钟,
#     错开到 :17 分基本能准时。UTC 01:17 / 13:17 = 北京 09:17 / 21:17。
#
# 关于 tag:merge-upstream 只同步分支不同步 tag。这不影响使用 —— 本地那份
#     D:\ComfyUIApi\ComfyUI-next 同时挂了 origin(本 fork) 和 upstream(官方仓),
#     要 checkout v0.34.5 这种稳定版直接 `git fetch upstream --tags` 即可。

name: 同步上游 ComfyUI

on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: '要同步的分支(自测用,平时留空即 master)'
        required: false
        default: 'master'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # 防止别人再 fork 走本仓后,在他们那边空跑一堆失败任务
    if: github.repository == 'BoomBT/ComfyUI-bobo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.event.inputs.branch || 'master' }}

    steps:
      - name: 追平上游
        run: |
          set -euo pipefail

          # merge_type: fast-forward = 有更新已拉平 / none = 本来就是最新 / merge = 本仓有自己的提交,做了合并
          if RESP=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
                      -f branch="$BRANCH" 2>&1); then
            echo "$RESP"
            echo "✅ 分支 $BRANCH 已追平上游"
          else
            echo "$RESP"
            # 409 = 与上游冲突,必须人工处理。这里**只报错不硬来**:
            # 绝不能为了"跑绿"去 force reset,那会把本仓自己的东西(含本同步器)冲掉 = 自杀。
            echo "::error::同步失败(多半是与上游冲突,需人工处理)。同步器本身完好,下次照常运行。"
            exit 1
          fi

      - name: 保活(防 60 天无活动被 GitHub 停掉 schedule)
        run: |
          set -euo pipefail
          # GitHub 会把「60 天没有活动」的仓库里的 scheduled workflow 自动禁用 —— 那时这条链会
          # 无声无息地死掉,没人会发现。上游 ComfyUI 一天提交好几次,正常永远轮不到这一步,
          # 这纯粹是兜底:万一上游停更两个月,靠这个空文件的时间戳把仓库"戳活"。
          LAST_ISO=$(gh api "repos/${GITHUB_REPOSITORY}/commits?per_page=1" --jq '.[0].commit.committer.date')
          DAYS=$(( ( $(date +%s) - $(date -d "$LAST_ISO" +%s) ) / 86400 ))
          echo "距上次提交 ${DAYS} 天(≥50 天才需要保活)"

          if [ "$DAYS" -ge 50 ]; then
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/.keepalive" --jq '.sha' 2>/dev/null || true)
            ARGS=(-f message="chore: keepalive(防 schedule 被 60 天无活动规则禁用)"
                  -f content="$(date -u +%FT%TZ | base64 -w0)"
                  -f branch="$BRANCH")
            [ -n "$SHA" ] && ARGS+=(-f sha="$SHA")
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.github/.keepalive" "${ARGS[@]}" --silent
            echo "已打保活戳"
          fi
