# ── fork 自动跟随上游 ───────────────────────────────────────────────────────
# 目标:BoomBT/ComfyUI-bobo 每 12 小时自动追平 Comfy-Org/ComfyUI,无人值守。
# 2026-09-07 建;2026-09-09 大改(前两版都因下面这条限制而失败,别再改回去)。
#
# 🔴🔴 核心约束:**GITHUB_TOKEN 推不动 `.github/workflows/`**
#   GITHUB_TOKEN 是 GitHub App 身份,GitHub 硬性拒绝 App 创建/更新 workflow 文件:
#     "refusing to allow a GitHub App to create or update workflow `xxx.yml`
#      without `workflows` permission"
#   而 workflow 的 `permissions:` 块里**根本没有 `workflows` 这一项**可以声明 —— 无解。
#
#   踩坑史(三步才踩透,记下来免得后人重走):
#     v1 用 `git merge + git push`      → 推 tag 时当场炸(tag 指向的历史含 workflow 变更)。
#     v2 改用 API `merge-upstream`      → **自测通过了但仍是错的**:自测分支没有自己的提交,
#        走的是 **fast-forward** 路径(GitHub 只快进指针,不算"创建 workflow 文件")。
#        而真实 master 有自己的提交(就是本文件),必须做**真 merge**,一旦上游改了任何
#        CI 文件就被拒。2026-09-09 05:58 的定时运行被 `cla.yml` 打回,才暴露出来。
#        → 教训:验证必须覆盖**真实路径**(merge),别拿 fast-forward 的成功当通过。
#     v3(本版)= git merge,但**把 `.github/workflows/` 整个排除在同步之外**。
#
#   为什么排除 workflows 是零损失的:本 fork 从上游继承的 27 个 CI **已全部禁用**
#   (它们在 fork 里注定失败,只会天天发失败邮件),同步它们的更新对我们毫无价值。
#   本仓 workflows 目录里只需要留本文件自己。
#
#   (Deploy key 也试过 —— 组织策略 "Deploy keys are disabled for this repository",此路不通。)
#
# 为什么 cron 不用整点:GitHub 的 schedule 在整点排队最重,错开到 :17 分。
#   UTC 01:17 / 13:17 = 北京 09:17 / 21:17。实测 GitHub 仍会延迟数小时,属正常。

name: 同步上游 ComfyUI

on:
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    # 防止别人再 fork 走本仓后,在他们那边空跑一堆失败任务
    if: github.repository == 'BoomBT/ComfyUI-bobo'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 取回本仓完整历史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # merge 要完整历史,浅克隆会直接失败
          persist-credentials: true

      - name: 追平上游(workflows 目录保持本仓版本)
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git remote add upstream https://github.com/Comfy-Org/ComfyUI.git 2>/dev/null \
            || git remote set-url upstream https://github.com/Comfy-Org/ComfyUI.git
          git fetch upstream master --force

          BEFORE=$(git rev-parse HEAD)

          if git merge --no-commit --no-ff upstream/master; then
            echo "合并无冲突"
          else
            # 只容忍 .github/workflows 下的冲突(那部分我们本来就要用自己的版本覆盖);
            # 其它文件真冲突 = 需要人介入,**只报错不硬来**,绝不 force reset ——
            # 那会把同步器自己冲掉 = 自杀,从此没有下一次运行且没人会发现它死了。
            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
            OTHER="$(printf '%s\n' "$CONFLICTS" | grep -v '^\.github/workflows/' | grep -v '^$' || true)"
            if [ -n "$OTHER" ]; then
              git merge --abort || true
              echo "::error::与上游有真冲突(非 workflow 文件),需人工处理。同步器本身完好,下次照常运行。"
              printf '%s\n' "$OTHER"
              exit 1
            fi
            echo "只有 workflows 目录冲突,按下面的规则用本仓版本解决"
          fi

          # 🔴 关键一步:把 .github/workflows 整个还原成**本仓版本**,
          #    包括删掉上游新增的 workflow 文件 —— 只要提交里不含 workflow 变更,
          #    GITHUB_TOKEN 就能正常推送。
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows
          git add -A .github/workflows

          if git rev-parse -q --verify MERGE_HEAD >/dev/null 2>&1; then
            git commit --no-edit -m "chore: 同步上游(.github/workflows 保持本仓版本)"
          fi

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin HEAD:master
            echo "✅ 已同步 ${BEFORE:0:8} → ${AFTER:0:8}"
          else
            echo "✅ 已经是最新,无需同步"
          fi

          # 自证:推完必须真的追平,别让"跑绿了"掩盖没同步成功
          git fetch upstream master --force
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "落后上游 ${BEHIND} 个提交"
          if [ "$BEHIND" -ne 0 ]; then
            echo "::error::推送后仍落后上游 ${BEHIND} 个提交 —— 同步没有真正生效。"
            exit 1
          fi

      - name: 保活(防 60 天无活动被 GitHub 停掉 schedule)
        run: |
          set -euo pipefail
          # GitHub 会把「60 天没有活动」的仓库里的 scheduled workflow 自动禁用 —— 那时这条链会
          # 无声无息地死掉。上游 ComfyUI 一天提交好几次,正常永远轮不到这一步,这纯粹是兜底。
          LAST=$(git log -1 --format=%ct)
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "距上次提交 ${DAYS} 天(≥50 天才需要保活)"
          if [ "$DAYS" -ge 50 ]; then
            git commit --allow-empty -m "chore: keepalive(防 schedule 被 60 天无活动规则禁用)"
            git push origin HEAD:master
            echo "已打保活提交"
          fi
